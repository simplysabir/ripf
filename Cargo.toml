[package]
name = "ripf"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive code search for the terminal: search, pick a result, open it in your editor at the exact line"
license = "MIT"
repository = "https://github.com/simplysabir/ripf"
readme = "README.md"
keywords = ["search", "grep", "ripgrep", "fuzzy", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.30"
nucleo-matcher = "0.3.1"
ratatui = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
toml = "1.1.4"
